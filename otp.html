<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Email · WalleX</title>
    <meta name="referrer" content="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
    <style>
        /* Auth page - mobile first (same as login/signup) */
        .auth-page {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 16px 20px;
            background: var(--black);
        }
        .auth-card {
            max-width: 420px;
            width: 100%;
            padding: 28px 20px;
            text-align: center;
        }
        .auth-card .logo {
            display: inline-block;
            margin-bottom: 20px;
        }
        .auth-card .logo img {
            height: 40px;
            width: auto;
        }
        .auth-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .auth-card .sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .auth-card .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(124,58,237,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.4rem;
            color: var(--purple);
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(124,58,237,0.25);
            min-height: 52px;
            justify-content: center;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(124,58,237,0.35);
        }
        .auth-link {
            display: block;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .auth-link a {
            color: var(--purple-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .auth-link a:hover {
            text-decoration: underline;
            color: var(--icy);
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .auth-card {
                padding: 24px 16px;
            }
            .auth-card h1 {
                font-size: 1.5rem;
            }
            .auth-card .sub {
                font-size: 0.85rem;
                margin-bottom: 20px;
            }
            .btn-primary {
                padding: 12px;
                font-size: 0.95rem;
                min-height: 48px;
            }
        }

        @media (max-width: 380px) {
            .auth-page {
                padding: 40px 12px 16px;
            }
            .auth-card {
                padding: 20px 12px;
            }
            .auth-card h1 {
                font-size: 1.3rem;
            }
            .auth-card .logo img {
                height: 34px;
            }
        }
    </style>
</head>
<body>

    <section class="auth-page">
        <div class="auth-card glass">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="WalleX" />
            </a>

            <div class="icon-circle">
                <i class="fas fa-envelope"></i>
            </div>

            <h1>Check Your Email</h1>
            <p class="sub">
                We've sent a confirmation link to <strong id="emailDisplay">your email</strong>.<br />
                Please click the link to verify your account.
            </p>

            <a href="login.html" class="btn-primary">
                <i class="fas fa-arrow-right"></i> Go to Login
            </a>

            <div class="auth-link">
                Already confirmed? <a href="login.html">Log in</a>
            </div>
        </div>
    </section>

    <script>
        // Display the email from sessionStorage if set (set during signup)
        (function() {
            const email = sessionStorage.getItem('otp_email') || 'your email';
            document.getElementById('emailDisplay').textContent = email;
        })();
    </script>

</body>
</html>
